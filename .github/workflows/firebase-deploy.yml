
name: Automatic Firebase Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Bun Runtime Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch Core Dependencies
        run: bun install

      - name: Compile Vite Production Build
        run: bun run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy Live Assets to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0367700963 }}
          projectId: gen-lang-client-0367700963
          channelId: live
